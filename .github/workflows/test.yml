name: PARS Testleri

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Python ${{ matrix.python-version }} kur
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Bağımlılıkları kur
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Linting - flake8
      run: flake8 pars/ --max-line-length=100 --ignore=E501,W503

    - name: Tip kontrolü - mypy
      run: mypy pars/ --ignore-missing-imports
      continue-on-error: true

    - name: Testleri çalıştır
      run: pytest testler/ --cov=pars --cov-report=xml -v

    - name: Kapsam raporu yükle
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
