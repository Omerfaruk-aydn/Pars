[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pars-dil"
version = "1.0.1"
description = "PARS — Türkçe Programlama Dili. Pars gibi hızlı. Türkçe gibi güzel."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["türkçe", "programlama", "dil", "pars", "turkish", "programming", "language"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Turkish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]

[project.scripts]
pars = "pars.cli.komutlar:main"
parskur = "pars.cli.paket:main"
parspip = "pars.cli.paket:main"
parspy = "pars.cli.python_modu:main"
parskopru = "pars.cli.kopru:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "black>=23.0",
    "isort>=5.0",
    "mkdocs-material>=9.0",
    "twine>=4.0",
    "build>=0.10",
]

[tool.pytest.ini_options]
testpaths = ["testler"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true

[tool.black]
line-length = 100
target-version = ["py38"]
